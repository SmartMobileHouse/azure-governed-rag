# Local dev loop: Postgres + pgvector, so you can iterate on the graph without a
# slow `azd deploy` each time. The app still calls Azure OpenAI / Content Safety
# / Language remotely (via `az login` -> DefaultAzureCredential).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
