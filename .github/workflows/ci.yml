name: ci

# Lint + unit tests + M4 governance eval gate + image build. This repo is
# published as an authority artifact, so main should never be red. The eval gate
# is deterministic (Azure leaves stubbed) — see evals/README.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync (with dev deps)
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Governance eval gate (deterministic, no cloud)
        run: uv run pytest tests/test_governance_evals.py -q

      - name: Build image
        run: docker build -t azure-governed-rag:ci .
